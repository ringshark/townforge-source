name: Test and deploy multiplayer server
on:
  workflow_dispatch:
  push:
    branches: [ringshark-patch-1]
    paths: ['server/mp/**', '.github/workflows/deploy-mp.yml']
permissions:
  contents: read
concurrency:
  group: townforge-multiplayer
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/mp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/mp/package-lock.json
      - run: npm ci
      - name: Check consent, combat and escrow
        run: |
          node test/den.mjs
          node test/ladder.mjs
      - name: Check actual sockets
        run: |
          npx wrangler dev --local --port 8787 --var 'ALLOWED_ORIGINS:' > /tmp/tf-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8787/health && break || sleep 1; done
          npm test
          node test/den-live.mjs
      - name: Deploy updated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the multiplayer update.'
            exit 1
          fi
          npx wrangler deploy
