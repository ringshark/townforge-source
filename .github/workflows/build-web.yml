name: Build Town Forge Web
on:
  push:
    branches: [ringshark-patch-1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: townforge-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.20'
          actions-cache-folder: emsdk-cache
      - name: Check guild client
        run: |
          node tests/guildnet-hub.cjs
          node tests/guildnet-refresh.cjs
          node tests/guild-project.cjs
          python tests/guild-parser.py
          node tests/guild-city-cloud.cjs
      - name: Check the 2D and 3D build variants and the backup code
        run: node tests/build-variants.cjs
      - name: Check combat and movement
        run: |
          g++ -std=c++17 tests/combat-motion.cpp -o /tmp/tf-combat-test
          /tmp/tf-combat-test
          g++ -std=c++17 tests/landscape-layout.cpp -o /tmp/tf-layout-test
          /tmp/tf-layout-test
          python tests/landscape-pointer.py
          python tests/transitions.py
          node tests/landscape-shell.cjs
          python tests/player-movement.py
          python tests/ui-input.py
          python tests/menu-scroll.py
          python tests/mobile-combat.py
          python tests/menu-status.py
          python tests/equipment-preview.py
          python tests/hero-model.py
          python tests/armor-assets.py
          node server/mp/test/den.mjs
          node server/mp/test/ladder.mjs
          node tests/den-client.cjs
      - name: Build raylib 6.0
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_WEB -j2
          g++ -std=c++17 -I /tmp/raylib/src tests/town-2d-art.cpp -o /tmp/tf-art-test
          /tmp/tf-art-test
          g++ -std=c++17 -I /tmp/raylib/src tests/world-visuals.cpp -o /tmp/tf-world-visuals
          /tmp/tf-world-visuals
          g++ -std=c++17 tests/homestead-life.cpp -o /tmp/tf-homestead-life
          /tmp/tf-homestead-life
          RAYLIB_DIR=/tmp/raylib python tests/avatar-motion.py
          RAYLIB_DIR=/tmp/raylib python tests/landscape-menus.py
      - name: Build game
        run: RAYLIB_DIR=/tmp/raylib bash web/build_web.sh
      - name: Package game
        env:
          TF_MP_URL: ${{ secrets.TF_MP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash web/deploy_web.sh build-web site
      - uses: actions/upload-artifact@v4
        with:
          name: townforge-web
          path: site/
          if-no-files-found: error
      # The 2D and 3D games (2026-10-19): the same source built twice, each with the view
      # switch removed. The preview repositories publish these (3D at townforge-3d-preview,
      # 2D at townforge); building both here keeps either from silently breaking.
      - name: Build the 2D and 3D games
        run: |
          RAYLIB_DIR=/tmp/raylib TF_VARIANT=2d bash web/build_web.sh
          RAYLIB_DIR=/tmp/raylib TF_VARIANT=3d bash web/build_web.sh
      - name: Package the 2D and 3D games
        env:
          TF_MP_URL: ${{ secrets.TF_MP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          TF_VARIANT=2d bash web/deploy_web.sh build-web-2d site-2d
          TF_VARIANT=3d bash web/deploy_web.sh build-web-3d site-3d
      - uses: actions/upload-artifact@v4
        with:
          name: townforge-web-2d
          path: site-2d/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: townforge-web-3d
          path: site-3d/
          if-no-files-found: error
